<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 168" width="660" role="img" aria-label="Walking creeper and Minecraft achievement">
  <title>Walking creeper · Achievement Get</title>
  <style>
    .leg{transform-box:fill-box;transform-origin:50% 0}
    .legA{animation:step .55s ease-in-out infinite alternate}
    .legB{animation:step .55s ease-in-out infinite alternate-reverse}
    @keyframes step{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
    .torso{animation:bob .275s ease-in-out infinite alternate}
    @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
    .orb{animation:float 2.6s ease-in-out infinite alternate}
    .o2{animation-duration:3.2s;animation-delay:.4s}
    .o3{animation-duration:2.2s;animation-delay:.8s}
    @keyframes float{from{transform:translateY(0);opacity:.55}to{transform:translateY(-9px);opacity:1}}
    .shine{animation:sweep 4.6s ease-in-out infinite}
    @keyframes sweep{0%,55%{transform:translateX(-70px)}100%{transform:translateX(520px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
