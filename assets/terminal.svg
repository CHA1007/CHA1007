<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" role="img" aria-label="CHA1007 terminal">
  <title>CHA1007 — terminal</title>
  <style>
    text { font-family: ui-monospace,'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace; }
    .boot { opacity:0; animation: boot .4s ease-out forwards; }
    .b1{animation-delay:.15s} .b2{animation-delay:.55s} .b3{animation-delay:.95s}
    .statusbar { opacity:0; transform:translateY(14px); animation: rise .45s ease-out 1.2s forwards; }
    .cursor { animation: blink 1.1s linear infinite; }
    .role { opacity:0; animation-duration:10s; animation-timing-function:linear; animation-iteration-count:infinite; animation-delay:.9s; }
    .r0{animation-name:role0} .r1{animation-name:role1} .r2{animation-name:role2} .r3{animation-name:role3} .r4{animation-name:role4}
    @keyframes boot { to{opacity:1} }
    @keyframes rise { to{opacity:1; transform:translateY(0)} }
    @keyframes blink { 0%,45%{opacity:1} 50%,95%{opacity:0} 100%{opacity:1} }
    @keyframes role0 { 0%{opacity:0} 1%{opacity:1} 19%{opacity:1} 20%{opacity:0} 100%{opacity:0} }
    @keyframes role1 { 0%,20%{opacity:0} 21%{opacity:1} 39%{opacity:1} 40%{opacity:0} 100%{opacity:0} }
    @keyframes role2 { 0%,40%{opacity:0} 41%{opacity:1} 59%{opacity:1} 60%{opacity:0} 100%{opacity:0} }
    @keyframes role3 { 0%,60%{opacity:0} 61%{opacity:1} 79%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
    @keyframes role4 { 0%,80%{opacity:0} 81%{opacity:1} 99%{opacity:1} 100%{opacity:0} }
  </style>
  <defs>
    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1.2" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="win">
      <rect x="0.5" y="0.5" width="879" height="295" rx="10"/>
    </clipPath>
  </defs>

  <!-- window frame -->
  <rect x="0.5" y="0.5" width="879" height="295" rx="10" fill="#0d1117" stroke="#30363d"/>

  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="1" y="1" width="878" height="33" fill="#161b22"/>
    <line x1="1" y1="34.5" x2="879" y2="34.5" stroke="#30363d" stroke-width="1"/>
    <circle cx="22" cy="17.5" r="5.5" fill="#ff5f56"/>
    <circle cx="42" cy="17.5" r="5.5" fill="#ffbd2e"/>
    <circle cx="62" cy="17.5" r="5.5" fill="#27c93f"/>
    <text x="440" y="22" text-anchor="middle" font-size="12" fill="#8b949e">cha1007@github: ~</text>

    <!-- $ figlet CHA1007 -->
    <g class="boot b1">
      <text x="24" y="64" font-size="13"><tspan fill="#7ee787">cha1007@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#e6edf3">$ figlet CHA1007</tspan></text>
      <text x="24" y="90" font-size="13.5" fill="#7ee787" xml:space="preserve"><tspan x="24" dy="0">   ________  _____   _______  ____  _____</tspan><tspan x="24" dy="17">  / ____/ / / /   | &lt;  / __ \/ __ \/__  /</tspan><tspan x="24" dy="17"> / /   / /_/ / /| | / / / / / / / /  / / </tspan><tspan x="24" dy="17">/ /___/ __  / ___ |/ / /_/ / /_/ /  / /  </tspan><tspan x="24" dy="17">\____/_/ /_/_/  |_/_/\____/\____/  /_/   </tspan></text>
    </g>

    <!-- $ echo $NEXT_RABBIT_HOLE (cycling) -->
    <g class="boot b2">
      <text x="24" y="186" font-size="13"><tspan fill="#7ee787">cha1007@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#e6edf3">$ echo </tspan><tspan fill="#d2a8ff">$NEXT_RABBIT_HOLE</tspan></text>
      <text x="24" y="208" font-size="13" fill="#3fb950">&gt;</text>
      <text class="role r0" x="42" y="208" font-size="13" fill="#e3b341">Minecraft Mod 新坑</text>
      <text class="role r1" x="42" y="208" font-size="13" fill="#e3b341">东方 Project 二创</text>
      <text class="role r2" x="42" y="208" font-size="13" fill="#e3b341">Aseprite 像素画</text>
      <text class="role r3" x="42" y="208" font-size="13" fill="#e3b341">Python 自动化小工具</text>
      <text class="role r4" x="42" y="208" font-size="13" fill="#e3b341">……总之是下一个新坑</text>
    </g>

    <!-- prompt + blinking cursor -->
    <g class="boot b3">
      <text x="24" y="234" font-size="13"><tspan fill="#7ee787">cha1007@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#e6edf3">$</tspan></text>
      <rect class="cursor" x="168" y="222" width="8" height="15" fill="#7ee787"/>
    </g>

    <!-- tmux-style status bar -->
    <g class="statusbar">
      <rect x="1" y="262" width="878" height="33" fill="#161b22"/>
      <line x1="1" y1="262.5" x2="879" y2="262.5" stroke="#30363d" stroke-width="1"/>
      <rect x="1" y="263" width="126" height="32" fill="#238636"/>
      <text x="16" y="283" font-size="12.5" font-weight="bold" fill="#ffffff">⚡ CHA1007</text>
      <text x="142" y="283" font-size="12" fill="#8b949e">⎇ main</text>
      <text x="864" y="283" font-size="12" fill="#8b949e" text-anchor="end">since 2025.02 · curiosity 100%</text>
    </g>

    <!-- CRT scanlines -->
    <rect x="1" y="1" width="878" height="294" fill="url(#scanlines)" pointer-events="none"/>
  </g>
</svg>
